version: 2.1

# Tool versions for the deploy-check job. Pinned: lint results change with
# linter releases, so the check must be reproducible. Bump a version below
# (twice: the executor environment and the cache key that embeds it — cache
# keys are static strings, so they cannot interpolate env vars).
deploy_cache_key: &deploy_cache_key deploy-tools-hadolint-2.12.0-helm-3.16.4

executors:
  golang:
    docker:
      - image: cimg/go:1.26
  node:
    docker:
      - image: cimg/node:25.8
  # Docker CLI + compose plugin preinstalled — the deploy-check job only
  # validates configs (compose config, hadolint, helm), no daemon builds.
  base:
    docker:
      - image: cimg/base:2025.09
    environment:
      HADOLINT_VERSION: "2.12.0"
      HELM_VERSION: "3.16.4"

jobs:
  lint:
    executor: golang
    steps:
      - checkout
      # Download and cache dependencies
      - restore_cache: &restore-cache
          keys:
            - go-mod-{{ checksum "go.sum" }}
      - run:
          name: Install dependencies
          command: |
            go mod download
      - run:
          name: Go fmt
          command: |
            RES="$(gofmt -s -l .)"
            if [ -n "${RES}" ]
            then
              echo "${RES}"
              exit 1
            fi
      - run:
          name: GolangCI Lint
          command: |
            golangci-lint --version
            golangci-lint run --verbose
      - save_cache: &save-cache
          paths:
            - /home/circleci/go/pkg/mod
          key: go-mod-{{ checksum "go.sum" }}
  test:
    executor: golang
    steps:
      - checkout
      - restore_cache:
          <<: *restore-cache
      - run:
          name: Install dependencies
          command: |
            go mod download
      - run:
          name: Test
          command: |
            make test
      - save_cache:
          <<: *save-cache

  jslint:
    executor: node
    steps:
      - checkout
      - restore_cache:
          keys:
            # Bump the ESLint pin below together with this key
            - eslint-9.39.2
      - run:
          name: Install ESLint
          # Pinned version: an unpinned install lints with whatever release
          # npm resolves that day, so CI results are not reproducible
          command: npm install --no-save eslint@9.39.2
      - run:
          name: Lint JavaScript
          command: |
            npx eslint --config eslint.config.mjs
      - save_cache:
          key: eslint-9.39.2
          paths:
            - /home/circleci/.npm

  deploy-check:
    executor: base
    steps:
      - checkout
      - restore_cache:
          keys:
            - *deploy_cache_key
      - run:
          name: Install hadolint (Dockerfile linter)
          # Pinned: lint results change with linter releases, so the check
          # must be reproducible
          command: |
            if [ ! -x /home/circleci/bin/hadolint ]; then
              curl -sSfL -o /home/circleci/bin/hadolint \
                "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64"
              chmod +x /home/circleci/bin/hadolint
            fi
            /home/circleci/bin/hadolint --version
      - run:
          name: Check docker compose
          # cimg/base ships compose as the docker-compose-plugin (a Docker
          # CLI plugin), which is what "docker compose config" resolves —
          # no install needed. Ubuntu's docker-compose-v2 package is not an
          # option: it ships the same cli-plugins path and dpkg refuses to
          # overwrite the image's plugin (exit 100, overwrite conflict).
          # The resolved version is image-controlled — accepted, because
          # "docker compose config" schema is stable across v2.x.
          command: docker compose version
      - run:
          name: Install helm
          command: |
            if [ ! -x /home/circleci/bin/helm ]; then
              curl -sSfL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" \
                | tar -xz -C /home/circleci/bin --strip-components=1 linux-amd64/helm
            fi
            /home/circleci/bin/helm version --short
      - run:
          name: Lint Dockerfile
          # A Dockerfile error surfaces here instead of failing the first
          # image build minutes later (or worse, at deploy time)
          command: /home/circleci/bin/hadolint deploy/Dockerfile
      - run:
          name: Validate docker-compose
          # compose config validates the file schema and variable
          # interpolation without needing a daemon
          command: docker compose -f deploy/docker-compose.yml config -q
      - run:
          name: Lint and render Helm charts
          command: |
            find deploy/charts -mindepth 1 -maxdepth 1 -type d | while read -r chart; do
              echo "== lint $chart =="
              /home/circleci/bin/helm lint "$chart"
              echo "== render $chart =="
              /home/circleci/bin/helm template "$chart" >/dev/null
            done
      - save_cache:
          key: *deploy_cache_key
          paths:
            - /home/circleci/bin

workflows:
  lint_test:
    jobs:
      - lint
      - jslint
      - test:
          requires:
            - lint
      - deploy-check
